title = "鲸语汇"
description = "群黑话自学习：从群聊里提取、模型自审、按群隔离，命中时注入提示词。"
version = "0.1.0"
author = "贰叔"
panel = "/plugins/whale_lexicon"

[[config]]
key = "enabled"
label = "启用学习与注入"
type = "bool"
default = true
help = "关掉之后只是不学不注入，已有词条和面板都还在"

[[config]]
key = "auto_learn"
label = "自动学习"
type = "bool"
default = true
help = "攒够一批聊天就调模型提取一次；关掉就只能手动触发"

[[config]]
key = "learn_batch_size"
label = "每批条数"
type = "number"
min = 5
max = 200
default = 20
help = "攒够这么多条群聊才学一次"

[[config]]
key = "learn_frequency"
label = "最短间隔（秒）"
type = "number"
min = 30
max = 86400
default = 300
help = "同一个群两次学习之间的最小间隔，避免把模型打满"

[[config]]
key = "extract_max"
label = "单次最多提取"
type = "number"
min = 1
max = 20
default = 5

[[config]]
key = "inject_max"
label = "单条消息最多注入"
type = "number"
min = 0
max = 8
default = 3
help = "0 = 不注入"

[[config]]
key = "max_meaning_chars"
label = "释义最大长度"
type = "number"
min = 20
max = 500
default = 200

[[config]]
key = "reject_words"
label = "拒绝词"
type = "text"
default = ""
help = "逗号分隔，这些词永远不会被收录"
