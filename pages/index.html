<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f9fcfe">
<link rel="icon" href="data:,">
<title>鲸语汇 · 词条</title>
<script>
  // 主题跟主面板共用一份选择，免得一个亮一个暗
  (function () {
    try {
      var saved = localStorage.getItem("qqbotlite-theme");
      var query = new URLSearchParams(location.search).get("theme");
      var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      var theme = query === "dark" || query === "light" ? query : saved || (prefersDark ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
      document.documentElement.style.colorScheme = theme;
      // Basecoat 认 .dark 类，跟着 data-theme 一起切
      document.documentElement.classList.toggle("dark", theme === "dark");
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", theme === "dark" ? "#0a0f1a" : "#f9fcfe");
    } catch (error) {}
  })();
</script>
<!-- 组件库：Basecoat（本地内置，无外部请求） -->
<link rel="stylesheet" href="/static/basecoat.css">
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/style.css">
<style>
/* 顶栏、页头、页签、卡片、弹窗、toast 的骨架全部来自 /static/style.css，
   这里只写词条列表自己的部分。颜色/圆角/阴影只引用 theme.css 的令牌。 */

.head-actions { min-width: 0; }
.head-actions .input { width: 240px; flex: none; }
.head-actions .btn { flex: none; white-space: nowrap; }

/* ---------- 范围筛选（模型配置同款白卡 + 卡片 + 滑动选中框） ---------- */

.scope-panel { margin: 0 0 18px; }
.scope-panel .card-head { padding: 13px 22px 9px; }
.scope-panel .card-pad { padding: 0 22px 13px; }
.scope-list {
  /* 主程序的 .entities 负责 flex/间距；卡片已经住在白卡里，不再加外层留白 */
  padding: 0;
}
.scope-list .entity {
  min-width: 220px;
  font: inherit;
  appearance: none;
  -webkit-appearance: none;
}

/* ---------- 列表卡 ---------- */

#list-card { transition: opacity var(--dur-2) var(--ease-out-quart); }
#list-card.is-loading { opacity: .55; pointer-events: none; }

.list-head {
  gap: 16px;
  border-bottom: 1px solid var(--hairline);
}
.list-meta {
  font-size: 12.5px;
  font-variant-numeric: tabular-nums;
  color: var(--muted);
  white-space: nowrap;
}
.list-tools { display: flex; align-items: center; gap: 8px; flex: none; }
.list-tools .select-host { flex: none; min-width: 0; }
.list-tools .ui-select { width: 132px; }
.list-tools .select { width: 132px; }

.bulkbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 9px 22px;
  border-bottom: 1px solid var(--hairline);
  background: color-mix(in oklab, var(--canvas) 55%, var(--card));
  color: var(--muted);
  font-size: 12.5px;
}
.bulkbar .bulk-check {
  display: flex;
  align-items: center;
  gap: 7px;
  flex: none;
  color: var(--text);
  white-space: nowrap;
  cursor: pointer;
}
.bulkbar input[type="checkbox"] {
  width: 14px;
  height: 14px;
  margin: 0;
  accent-color: var(--primary);
}
.bulkbar .spacer { flex: 1; }
.bulkbar .btn { height: 30px; padding: 0 11px; font-size: 12px; }
.bulk-info { flex: none; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ---------- 词条行 ---------- */

.entries { display: block; }

.entry {
  display: grid;
  grid-template-columns: minmax(96px, 150px) minmax(0, 1fr) auto;
  align-items: start;
  gap: 16px;
  padding: 15px 22px;
  border-top: 1px solid var(--hairline);
  background: transparent;
  transition: background-color var(--dur-2) var(--ease-out-quart);
}
.entry:first-child { border-top: 0; }
.entry.has-pick { grid-template-columns: 24px minmax(96px, 150px) minmax(0, 1fr) auto; }
.entry:hover { background: color-mix(in oklab, var(--canvas) 55%, var(--card)); }
.entry.picked { background: color-mix(in oklab, var(--primary-soft) 55%, var(--card)); }
.entry.picked:hover { background: color-mix(in oklab, var(--primary-soft) 72%, var(--card)); }

.entry-pick {
  width: 24px;
  height: 24px;
  display: grid;
  place-items: center;
  align-self: center;
  border-radius: 6px;
  cursor: pointer;
}
.entry-pick:hover,
.entry-pick:focus-within { background: var(--primary-soft); }
.entry-pick input {
  width: 15px;
  height: 15px;
  margin: 0;
  accent-color: var(--primary);
  cursor: pointer;
}

.entry-name {
  min-width: 0;
  padding-top: 1px;
  font-size: 13.5px;
  font-weight: 600;
  line-height: 1.45;
  word-break: break-word;
}
.entry-body { min-width: 0; }
.entry-meaning {
  margin: 0;
  font-size: 13px;
  line-height: 1.6;
  color: var(--text);
  word-break: break-word;
  text-wrap: pretty;
}
.entry-meaning.empty { color: var(--muted); }
.entry-meta {
  margin: 4px 0 0;
  font-size: 11.5px;
  line-height: 1.5;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  word-break: break-word;
  text-wrap: pretty;
}
.entry.is-wiki .entry-meaning {
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.entry.is-wiki .entry-ops { align-self: center; }

.entry-ops {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 6px;
  align-self: center;
  flex-wrap: wrap;
}
.entry-ops .btn { height: 30px; padding: 0 10px; font-size: 12px; }
.entry-ops .tag { white-space: nowrap; }

.blank-card .blank-action { margin-top: 14px; }
.blank-card .blank-action .btn { height: 32px; padding: 0 12px; font-size: 12.5px; }

/* ---------- 卡脚 / 翻页 ---------- */

.list-foot { justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.foot-count { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted); }
.pager { display: flex; align-items: center; gap: 8px; }
.pager .btn { height: 30px; padding: 0 10px; font-size: 12px; }

/* ---------- 状态 / 提示 ---------- */

.conn.warn { background: var(--warning-soft); color: var(--warning-ink); }

/* ---------- 设置弹窗 ---------- */

.settings-modal { width: min(720px, calc(100vw - 32px)); }
.settings-modal .dialog-grid { align-items: start; }
.settings-modal .field-wide { grid-column: 1 / -1; }
.settings-modal .field-head { margin-bottom: 6px; }
#settingsHint {
  margin-right: auto;
  max-width: 60%;
  font-size: 12px;
  color: var(--danger);
  overflow-wrap: anywhere;
}
#settingsHint:empty { display: none; }

/* ---------- 录入 / 修改弹窗 ---------- */

.editor-fields { display: grid; gap: 14px; }
.editor-fields .field-head {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 6px;
}
.editor-fields .field-head label { font-size: 12.5px; font-weight: 500; }
.editor-fields .field-head .counter { margin-left: auto; }
.editor-fields .key { font-size: 10.5px; }
.editor-fields .textarea { min-height: 132px; }
.counter {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.counter.over { color: var(--danger); font-weight: 600; }
#editHint {
  margin: 0 auto 0 0;
  max-width: 60%;
  font-size: 12px;
  line-height: 1.5;
  color: var(--danger);
  overflow-wrap: anywhere;
}
#editHint:empty { display: none; }

/* ---------- 二次确认 ---------- */

.confirm-modal { width: min(420px, calc(100vw - 32px)); }
.confirm-text {
  margin: 0;
  font-size: 13px;
  line-height: 1.7;
  color: var(--text);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

@media (max-width: 900px) {
  .head-actions { width: 100%; }
  .head-actions .input { width: auto; flex: 1 1 180px; }
  .list-head { flex-wrap: wrap; }
  .list-tools { width: 100%; }
  .list-tools .select-host { flex: 1 1 auto; width: 100%; }
  .list-tools .ui-select,
  .list-tools .select { width: 100%; }
  .entry,
  .entry.is-wiki {
    grid-template-columns: minmax(0, 1fr);
    grid-template-areas: "name" "body" "ops";
    gap: 10px 12px;
    padding: 14px 16px;
  }
  .entry.has-pick {
    grid-template-columns: 24px minmax(0, 1fr);
    grid-template-areas: "pick name" "body body" "ops ops";
  }
  .entry-pick { grid-area: pick; align-self: center; }
  .entry-name { grid-area: name; }
  .entry-body { grid-area: body; }
  .entry-ops { grid-area: ops; justify-content: flex-start; }
}

@media (max-width: 560px) {
  .list-head, .bulkbar, .list-foot { padding-left: 16px; padding-right: 16px; }
  .scope-panel .card-head, .scope-panel .card-pad { padding-left: 16px; padding-right: 16px; }
  .bulkbar { flex-wrap: wrap; row-gap: 8px; }
  .bulkbar .spacer { display: none; }
  .bulkbar .btn { flex: none; }
  .entry { padding: 13px 16px; }
  .entry-ops { justify-content: stretch; }
  .entry-ops .btn { flex: 1 1 auto; }
  #editMask .dialog-panel > footer,
  #settingsMask .dialog-panel > footer { flex-wrap: wrap; }
  #settingsHint, #editHint {
    flex: 1 1 100%;
    max-width: 100%;
    margin-right: 0;
  }
}
</style>

<!-- 主程序的自绘下拉框（#llm 进阶设置「思考档位」同款） -->
<script src="/static/ui.js"></script>
<script>
"use strict";

const $ = (id) => document.getElementById(id);
const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));
const LABELS = { manual: "手动", auto: "黑话库", pending: "待审", wiki: "梗百科" };
const DESCS = {
  manual: "人工维护的词条，优先自动学习的结果",
  auto: "从群聊里学来的黑话，按群隔离",
  pending: "拿不准的候选，通过后才会参与注入",
  wiki: "梗百科兜底，只读；黑话没命中时才会用到",
};
const ORDER = ["manual", "auto", "pending", "wiki"];
const PLUGIN_ID = "whale_lexicon";

const state = {
  bucket: "manual",
  scope: "",
  scoped: false,
  search: "",
  sort: "recent",
  page: 1,
  size: 50,
  tree: null,
  names: {},
  items: new Map(),
  selected: new Set(),
  limit: 200,
  editing: null,
  confirmHandler: null,
  statusDown: false,
};

let listSeq = 0;
let searchTimer = 0;
let pendingDuplicate = null;
let sortPicker = null;
let scopePicker = null;

/* ---------- 基础 ---------- */

function esc(value) {
  return String(value === null || value === undefined ? "" : value)
    .replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}

function fmtNum(value) {
  const n = Number(value) || 0;
  return n.toLocaleString("zh-CN");
}

function fmtDate(ts) {
  if (!ts) return "";
  const d = new Date(Number(ts) * 1000);
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

/** group:123456 → 123456；面板上只显示号码 */
function scopeId(scope) {
  const at = scope.lastIndexOf(":");
  return at >= 0 ? scope.slice(at + 1) : scope;
}

function scopeName(scope) {
  if (!scope) return "全局";
  if (state.names[scope]) return state.names[scope];
  const at = scope.lastIndexOf(":");
  const kind = at >= 0 ? scope.slice(0, at) : "";
  const ident = at >= 0 ? scope.slice(at + 1) : scope;
  return kind === "private" ? `私聊 ${ident}` : `群 ${ident}`;
}

function reducedMotion() {
  return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
}

/** 下拉框用主程序同一个 uiSelect（#llm 进阶设置「思考档位」那套）；
    旧主程序没有 ui.js 时退回原生 select，保证面板还能用。 */
function makeSelect(config) {
  if (typeof uiSelect === "function") return uiSelect(config);
  const select = document.createElement("select");
  select.className = "select";
  if (config.id) select.id = config.id;
  if (config.label) select.setAttribute("aria-label", config.label);
  for (const item of config.items || []) {
    const option = document.createElement("option");
    option.value = String(item.value === undefined || item.value === null ? "" : item.value);
    option.textContent = item.label === undefined || item.label === null ? option.value : String(item.label);
    select.append(option);
  }
  select.value = config.value === undefined || config.value === null ? "" : String(config.value);
  if (typeof config.onChange === "function") {
    select.addEventListener("change", () => config.onChange(select.value));
  }
  return select;
}

function toastStackFor(host) {
  let stack = Array.from(host.children).find((node) => node.classList?.contains("toast-stack"));
  if (!stack) {
    stack = document.createElement("div");
    stack.className = "toast-stack";
    stack.setAttribute("aria-live", "polite");
    host.append(stack);
  }
  return stack;
}

function syncToastStack(stack) {
  if (!stack || stack.children.length > 0) return;
  const dialog = stack.closest("dialog");
  if (dialog) {
    dialog.classList.remove("toast-open");
    stack.remove();
  }
}

function dismissToast(node) {
  if (!node || !node.isConnected || node.classList.contains("is-leaving")) return;
  const stack = node.parentElement;
  clearTimeout(node._timer);
  node.classList.add("is-leaving");
  window.setTimeout(() => {
    node.remove();
    syncToastStack(stack);
  }, 160);
}

function toast(message, kind = "ok") {
  // 正在退场的弹窗不能再收通知：关掉之后它整个不可见，通知会跟着消失
  const dialog = document.querySelector("dialog[open]:not(.is-closing)");
  const host = dialog || document.body;
  const stack = toastStackFor(host);
  if (dialog) dialog.classList.add("toast-open");

  const node = document.createElement("div");
  node.className = `toast-item ${kind}`;
  node.tabIndex = 0;
  node.title = "点击关闭";
  node.setAttribute("role", kind === "bad" ? "alert" : "status");
  node.setAttribute("aria-live", kind === "bad" ? "assertive" : "polite");

  const text = document.createElement("div");
  text.className = "toast-text";
  text.textContent = message;
  const bar = document.createElement("span");
  bar.className = "toast-bar";
  bar.setAttribute("aria-hidden", "true");
  node.append(text, bar);

  node.addEventListener("click", () => dismissToast(node));
  node.addEventListener("keydown", (event) => {
    if (event.key === "Enter" || event.key === " " || event.key === "Escape") {
      event.preventDefault();
      dismissToast(node);
    }
  });

  const life = kind === "bad" ? 5200 : 3200;
  bar.style.animationDuration = `${life}ms`;
  node._timer = window.setTimeout(() => dismissToast(node), life);
  stack.prepend(node);
  while (stack.children.length > 3) {
    const old = stack.lastElementChild;
    if (old) {
      clearTimeout(old._timer);
      old.remove();
    }
  }
}

async function req(path, body) {
  const init = body === undefined ? {} : {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  };
  const res = await fetch("./" + path, { cache: "no-store", ...init });
  let data = null;
  try { data = await res.json(); } catch (error) { /* 非 JSON 时下面统一报错 */ }
  if (!data) throw new Error(`服务器返回了 ${res.status}`);
  if (!res.ok || data.ok === false) throw new Error(data.message || `请求失败（${res.status}）`);
  return data;
}

/* ---------- 弹窗 ---------- */

function openMask(node) {
  if (!node || typeof node.showModal !== "function" || node.open) return;
  // 跟主面板一样：先聚焦 dialog 本身，避免 showModal 把焦点丢给「取消」并亮一圈
  node.tabIndex = -1;
  node.showModal();
  node.focus();
}

/* host-gap：面板只加载 ui.js，没有主面板 plugins.js 里的 closeDialog()。
   退场样式（.modal[open].is-closing / dialog-out / backdrop-out）由宿主 style.css 提供，
   这里只补「等动画结束再 close」的时序；宿主把通用 closeDialog 放进 ui.js 后换掉这段。 */
const CLOSE_MOTION_MS = 180;

function closeMask(node) {
  if (!node || typeof node.close !== "function" || !node.open
      || node.classList.contains("is-closing")) return;
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    node.close();
    return;
  }
  // 先播退场（.is-closing 的 animation），animationend 之后再真正 close
  node.classList.add("is-closing");
  let done = false;
  function finish() {
    if (done) return;
    done = true;
    node.removeEventListener("animationend", onEnd);
    node.classList.remove("is-closing");
    node.close();
  }
  function onEnd(event) {
    if (event.target === node && event.animationName === "dialog-out") finish();
  }
  node.addEventListener("animationend", onEnd);
  window.setTimeout(finish, CLOSE_MOTION_MS + 150); // 动画被系统吞掉时兜底
}

function showConfirm(title, text, okLabel, onOk, danger) {
  $("confirmTitle").textContent = title;
  $("confirmText").textContent = text;
  const ok = $("confirmOk");
  ok.textContent = okLabel || "确定";
  if (danger) ok.dataset.variant = "destructive";
  else delete ok.dataset.variant;
  state.confirmHandler = onOk;
  openMask($("confirmMask"));
}

$("confirmOk").addEventListener("click", async () => {
  const handler = state.confirmHandler;
  state.confirmHandler = null;
  closeMask($("confirmMask"));
  if (!handler) return;
  try { await handler(); } catch (error) { toast(error.message, "bad"); }
});

$("confirmMask").addEventListener("close", () => { state.confirmHandler = null; });

$$("[data-close]").forEach((node) => {
  node.addEventListener("click", () => closeMask(node.closest("dialog")));
});

// 点遮罩关闭：原生 dialog 下，点到 dialog 本身就说明点在了背景上
$$("dialog.modal").forEach((mask) => {
  // Esc：拦下原生关闭，走同一条退场路径
  mask.addEventListener("cancel", (event) => {
    event.preventDefault();
    closeMask(mask);
  });
  mask.addEventListener("click", (event) => {
    if (event.target === mask) closeMask(mask);
  });
});

/* ---------- 页签 ---------- */

function tabId(key) {
  return `tab-${key}`;
}

function renderTabs() {
  const tabs = $("tabs");
  if (!state.tree) return;
  const frag = document.createDocumentFragment();
  for (const bucket of state.tree.buckets) {
    const tab = document.createElement("button");
    tab.type = "button";
    tab.className = "tabbtn";
    tab.id = tabId(bucket.key);
    tab.dataset.bucket = bucket.key;
    tab.setAttribute("aria-controls", "list-card");
    tab.setAttribute("aria-current", state.bucket === bucket.key ? "page" : "false");
    tab.tabIndex = state.bucket === bucket.key ? 0 : -1;
    const label = document.createElement("span");
    label.textContent = bucket.label;
    const count = document.createElement("span");
    count.className = "count";
    count.textContent = fmtNum(bucket.count);
    tab.append(label, count);
    frag.append(tab);
  }
  const ink = document.createElement("span");
  ink.className = "tab-ink";
  ink.id = "tab-ink";
  ink.setAttribute("aria-hidden", "true");
  frag.append(ink);
  tabs.replaceChildren(frag);
  requestAnimationFrame(() => moveInk(false));
}

function syncTabs() {
  for (const tab of $$("#tabs .tabbtn")) {
    const on = tab.dataset.bucket === state.bucket;
    tab.setAttribute("aria-current", on ? "page" : "false");
    tab.tabIndex = on ? 0 : -1;
  }
}

function moveInk(animate) {
  const ink = $("tab-ink");
  const active = document.querySelector('#tabs .tabbtn[aria-current="page"]');
  if (!ink || !active) return;
  const left = active.offsetLeft;
  const width = active.offsetWidth;
  if (!animate) ink.style.transition = "none";
  ink.style.width = `${width}px`;
  ink.style.transform = `translateX(${left}px)`;
  if (!animate) {
    void ink.offsetWidth;
    ink.style.transition = "";
  }
}

function animateCard(direction) {
  if (reducedMotion()) return;
  const card = $("list-card");
  card.animate(
    [
      { opacity: .4, transform: `translateX(${direction * 8}px)` },
      { opacity: 1, transform: "none" },
    ],
    { duration: 220, easing: "cubic-bezier(.16, 1, .3, 1)" },
  );
}

function syncListTools() {
  const onWiki = state.bucket === "wiki";
  const host = $("sortHost");
  if (host) host.hidden = onWiki;
  const sort = $("sort");
  if (sort) sort.hidden = onWiki;
  $("addBtn").hidden = state.bucket !== "manual";
}

function initSortPicker() {
  const host = $("sortHost");
  if (!host || sortPicker) return;
  sortPicker = makeSelect({
    id: "sort",
    label: "排序方式",
    value: state.sort,
    items: [
      { value: "recent", label: "最新优先" },
      { value: "count", label: "次数优先" },
    ],
    onChange: (value) => {
      state.sort = value === "count" ? "count" : "recent";
      state.page = 1;
      loadList({ direction: 0 });
    },
  });
  host.append(sortPicker);
}

function paintHead(animate) {
  const title = $("page-title");
  const sub = $("page-sub");
  const label = LABELS[state.bucket] || "词条";
  let text = DESCS[state.bucket] || "";
  if (state.scoped) {
    text += state.scope ? ` · ${scopeName(state.scope)} [${scopeId(state.scope)}]` : " · 全局";
  }
  const changed = title.textContent !== label || sub.textContent !== text;
  title.textContent = label;
  sub.textContent = text;
  document.title = `${label} · 鲸语汇`;
  if (!animate || !changed || reducedMotion()) return;
  for (const node of [title, sub]) {
    node.animate(
      [
        { opacity: 0, transform: "translateY(2px)" },
        { opacity: 1, transform: "none" },
      ],
      { duration: 200, easing: "cubic-bezier(.16, 1, .3, 1)" },
    );
  }
}

function selectBucket(key) {
  if (!state.tree || !state.tree.buckets.some((bucket) => bucket.key === key)) return;
  const previous = ORDER.indexOf(state.bucket);
  const next = ORDER.indexOf(key);
  const changed = state.bucket !== key || state.scoped || state.search || state.page !== 1;
  if (!changed) return;
  state.bucket = key;
  state.scope = "";
  state.scoped = false;
  state.search = "";
  state.page = 1;
  $("search").value = "";
  syncTabs();
  renderScopes();
  syncListTools();
  $("bulkbar").hidden = true;
  $("list-meta").textContent = "读取中…";
  paintHead(true);
  moveInk(true);
  window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
  const direction = next === previous ? 0 : (next > previous ? 1 : -1);
  loadList({ direction });
}

$("tabs").addEventListener("click", (event) => {
  const tab = event.target.closest(".tabbtn");
  if (tab) selectBucket(tab.dataset.bucket);
});

$("tabs").addEventListener("keydown", (event) => {
  const tabs = $$("#tabs .tabbtn");
  const current = tabs.findIndex((tab) => tab.getAttribute("aria-current") === "page");
  let next = null;
  if (event.key === "ArrowRight") next = (current + 1) % tabs.length;
  else if (event.key === "ArrowLeft") next = (current - 1 + tabs.length) % tabs.length;
  else if (event.key === "Home") next = 0;
  else if (event.key === "End") next = tabs.length - 1;
  if (next === null) return;
  event.preventDefault();
  tabs[next].focus();
  selectBucket(tabs[next].dataset.bucket);
});

/* ---------- 范围筛选（模型配置同款卡片 + 滑动选中框） ---------- */

function scopeInkRect() {
  const list = $("scope-list");
  const active = list && list.querySelector('.scope-card[aria-current="true"]');
  if (!active) return null;
  return {
    x: active.offsetLeft,
    y: active.offsetTop,
    w: active.offsetWidth,
    h: active.offsetHeight,
  };
}

function placeScopeInk(from, animate) {
  const list = $("scope-list");
  if (!list) return;
  let ink = list.querySelector(".entity-ink");
  if (!ink) {
    ink = document.createElement("span");
    ink.className = "entity-ink";
    ink.setAttribute("aria-hidden", "true");
    list.prepend(ink);
  }
  const to = scopeInkRect();
  if (!to || !to.w) {
    ink.hidden = true;
    return;
  }
  ink.hidden = false;
  const apply = (rect) => {
    ink.style.transform = `translate(${rect.x}px, ${rect.y}px)`;
    ink.style.width = `${rect.w}px`;
    ink.style.height = `${rect.h}px`;
  };
  ink.style.transition = "none";
  apply(from || to);
  void ink.offsetWidth;
  if (from && animate && !reducedMotion()) {
    ink.style.transition = "";
    requestAnimationFrame(() => apply(to));
  } else {
    apply(to);
    void ink.offsetWidth;
    ink.style.transition = "";
  }
}

function scopeCard(scope, name, meta, active, all) {
  const card = document.createElement("button");
  card.type = "button";
  card.className = "entity scope-card";
  card.dataset.scope = all ? "__all__" : scope;
  card.setAttribute("aria-current", active ? "true" : "false");
  card.setAttribute("aria-label", `${name}，${meta}`);
  const nameNode = document.createElement("span");
  nameNode.className = "entity-name";
  nameNode.textContent = name;
  const metaNode = document.createElement("span");
  metaNode.className = "entity-meta";
  metaNode.textContent = meta;
  card.append(nameNode, metaNode);
  if (active) {
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = "筛选中";
    card.append(tag);
  }
  return card;
}

function renderScopes(options) {
  const opts = options || {};
  const wrap = $("scopebar");
  const list = $("scope-list");
  const bucket = state.tree && state.tree.buckets.find((item) => item.key === state.bucket);
  const subs = (bucket && bucket.subs) || [];
  if (state.bucket === "wiki" || !subs.length) {
    wrap.hidden = true;
    list.replaceChildren();
    return;
  }
  wrap.hidden = false;
  let activeName = "全部";
  let activeCount = bucket.count;
  if (state.scoped) {
    const active = subs.find((sub) => sub.scope === state.scope);
    activeName = state.scope ? ((active && active.name) || "未命名群") : "全局";
    activeCount = active ? active.count : 0;
  }
  const metaNode = $("scope-meta");
  if (metaNode) metaNode.textContent = `${fmtNum(activeCount)} 条 · 当前「${activeName}」`;
  const from = opts.animate ? scopeInkRect() : null;
  const frag = document.createDocumentFragment();
  frag.append(scopeCard("", "全部", `所有群 · ${fmtNum(bucket.count)} 条`, !state.scoped, true));
  for (const sub of subs) {
    const isGlobal = !sub.scope;
    const meta = `${isGlobal ? "所有群通用" : `[${scopeId(sub.scope)}]`} · ${fmtNum(sub.count)} 条`;
    frag.append(scopeCard(
      sub.scope,
      isGlobal ? "全局" : (sub.name || "未命名群"),
      meta,
      state.scoped && state.scope === sub.scope,
      false,
    ));
  }
  list.replaceChildren(frag);
  placeScopeInk(from, Boolean(from && opts.animate));
}

$("scope-list").addEventListener("click", (event) => {
  const card = event.target.closest(".scope-card");
  if (!card) return;
  const raw = card.dataset.scope;
  const scoped = raw !== "__all__";
  const scope = scoped ? raw : "";
  if (state.scoped === scoped && state.scope === scope) return;
  state.scoped = scoped;
  state.scope = scope;
  state.page = 1;
  renderScopes({ animate: true });
  paintHead(true);
  loadList({ direction: 0 });
});

/* ---------- 列表 ---------- */

function scopeItems(current) {
  const items = [{ value: "__global__", label: "全局（所有群）" }];
  const seen = new Set();
  (state.tree ? state.tree.buckets : []).forEach((bucket) => {
    (bucket.subs || []).forEach((sub) => {
      if (!sub.scope || seen.has(sub.scope)) return;
      seen.add(sub.scope);
      const name = sub.name || "未命名群";
      items.push({ value: sub.scope, label: `${name} [${scopeId(sub.scope)}]` });
    });
  });
  if (current && current !== "__global__" && !seen.has(current)) {
    items.push({ value: current, label: scopeName(current) });
  }
  return items;
}

function entryHTML(item) {
  const name = item.content || "";
  if (item.read_only) {
    const tags = item.tags ? ` · ${esc(item.tags)}` : "";
    return `<article class="entry is-wiki" data-key="${esc(item.id)}">
      <div class="entry-name">${esc(name)}</div>
      <div class="entry-body">
        <p class="entry-meaning${item.meaning ? "" : " empty"}" title="${esc(item.meaning)}">${esc(item.meaning) || "（没有摘要）"}</p>
        <p class="entry-meta">梗百科 · 只读${tags}</p>
      </div>
      <div class="entry-ops"><span class="tag">只读</span></div>
    </article>`;
  }

  const pending = state.bucket === "pending";
  const picked = state.selected.has(item.id);
  const pick = pending
    ? `<label class="entry-pick" title="选择">
         <input type="checkbox" ${picked ? "checked" : ""} aria-label="选择 ${esc(name)}">
       </label>`
    : "";
  const src = item.source === "manual" ? "手动" : "自动";
  const where = item.is_global ? "全局" : esc(scopeName(item.scope));
  const who = item.contributor ? `来源：${esc(item.contributor)}` : "";
  const note = item.auto_note ? `理由：${esc(item.auto_note)}` : "";
  const meta = [src, where, who, `×${item.count || 1}`,
    item.updated_at ? fmtDate(item.updated_at) : "", note].filter(Boolean).join(" · ");
  const keywords = item.keywords ? `<p class="entry-meta">关键词：${esc(item.keywords)}</p>` : "";

  return `<article class="entry${pending ? " has-pick" : ""}${picked ? " picked" : ""}" data-key="${esc(item.id)}">
    ${pick}
    <div class="entry-name">${esc(name)}</div>
    <div class="entry-body">
      <p class="entry-meaning${item.meaning ? "" : " empty"}">${esc(item.meaning) || "（没有含义）"}</p>
      ${keywords}
      <p class="entry-meta">${meta}</p>
    </div>
    <div class="entry-ops">
      <button class="btn" data-variant="outline" data-size="sm" type="button" data-act="approve">${pending ? "通过" : "驳回"}</button>
      <button class="btn" data-variant="outline" data-size="sm" type="button" data-act="edit">修改</button>
      <button class="btn" data-variant="destructive" data-size="sm" type="button" data-act="del">删除</button>
    </div>
  </article>`;
}

function emptyHTML() {
  if (state.search) {
    return `<div class="blank-card">没有匹配「${esc(state.search)}」的词条。
      <div class="blank-action"><button class="btn" data-variant="outline" data-size="sm" type="button" data-act="clear-search">清空搜索</button></div>
    </div>`;
  }
  const text = {
    manual: "还没有手动词条。",
    auto: "还没有学来的词条。",
    pending: "没有待审的候选，等模型学一批。",
    wiki: "梗百科还没有条目。",
  }[state.bucket] || "这里还没有词条。";
  const action = state.bucket === "manual"
    ? `<div class="blank-action"><button class="btn" data-variant="outline" data-size="sm" type="button" data-act="new">+ 手动录入</button></div>`
    : "";
  return `<div class="blank-card">${text}${action}</div>`;
}

function renderError(error) {
  state.items.clear();
  state.selected.clear();
  $("list-meta").textContent = "读取失败";
  $("list").innerHTML = `<div class="blank-card">列表读取失败：${esc(error.message)}
    <div class="blank-action"><button class="btn" data-variant="outline" data-size="sm" type="button" data-act="retry">重试</button></div>
  </div>`;
  $("list-foot").hidden = true;
  $("bulkbar").hidden = true;
}

function renderPager(total, page, size) {
  const pages = Math.max(1, Math.ceil(total / size));
  $("foot-count").textContent = `第 ${page} / ${pages} 页 · 每页 ${size} 条`;
  const pager = $("pager");
  pager.hidden = pages <= 1;
  pager.innerHTML = `<button class="btn" data-variant="outline" data-size="sm" type="button" data-page="${page - 1}" ${page <= 1 ? "disabled" : ""}>上一页</button>
    <span>${page} / ${pages}</span>
    <button class="btn" data-variant="outline" data-size="sm" type="button" data-page="${page + 1}" ${page >= pages ? "disabled" : ""}>下一页</button>`;
}

function renderList(data) {
  const items = data.items || [];
  state.items.clear();
  state.selected.clear();
  items.forEach((item) => state.items.set(item.id, item));

  $("list-meta").textContent = `共 ${fmtNum(data.total)} 条`;
  $("list").dataset.bucket = state.bucket;
  $("list").innerHTML = items.length ? items.map(entryHTML).join("") : emptyHTML();
  syncListTools();
  $("list-foot").hidden = data.total === 0;
  if (data.total > 0) {
    renderPager(data.total, data.page || state.page, data.size || state.size);
  }
  syncBulk();
}

async function loadList(options) {
  const opts = options || {};
  const direction = typeof opts.direction === "number" ? opts.direction : null;
  const seq = ++listSeq;
  const card = $("list-card");
  card.classList.add("is-loading");
  let ok = false;
  try {
    let data = null;
    while (true) {
      const params = new URLSearchParams({
        bucket: state.bucket,
        search: state.search,
        scope: state.scoped ? state.scope : "",
        scoped: state.scoped ? "true" : "false",
        page: String(state.page),
        size: String(state.size),
        sort: state.sort,
      });
      data = await req("list?" + params.toString());
      if (seq !== listSeq) return;
      // 页码越界（比如删到最后一页空了）就回第一页，不把空页留给用户
      if (data.items && data.items.length === 0 && state.page > 1) {
        state.page = 1;
        continue;
      }
      break;
    }
    renderList(data);
    ok = true;
  } catch (error) {
    if (seq === listSeq) renderError(error);
  } finally {
    if (seq === listSeq) {
      card.classList.remove("is-loading");
      if (ok && direction !== null) animateCard(direction);
    }
  }
}

$("pager").addEventListener("click", (event) => {
  const button = event.target.closest("button[data-page]");
  if (!button || button.disabled) return;
  state.page = Number(button.dataset.page);
  loadList({ direction: 0 });
});

/* ---------- 词条操作 ---------- */

$("list").addEventListener("change", (event) => {
  const box = event.target.closest(".entry-pick input");
  if (!box) return;
  const row = box.closest(".entry");
  const key = row.dataset.key;
  if (box.checked) state.selected.add(key);
  else state.selected.delete(key);
  row.classList.toggle("picked", box.checked);
  syncBulk();
});

async function approveEntry(item, button) {
  button.disabled = true;
  try {
    const data = await req("approve", { table: item.table, name: item.content, scope: item.scope || "" });
    toast(data.message || "已处理", "ok");
    await refresh();
  } catch (error) {
    toast(error.message, "bad");
    button.disabled = false;
  }
}

async function deleteEntry(item) {
  const data = await req("delete", { table: item.table, name: item.content, scope: item.scope || "" });
  toast(data.message || "已删除", "ok");
  await refresh();
}

$("list").addEventListener("click", (event) => {
  const button = event.target.closest("button[data-act]");
  if (!button) return;
  const act = button.dataset.act;
  if (act === "new") { openEditor(null); return; }
  if (act === "clear-search") {
    $("search").value = "";
    state.search = "";
    state.page = 1;
    loadList({ direction: 0 });
    return;
  }
  if (act === "retry") { refresh(); return; }

  const row = button.closest(".entry");
  const item = row && state.items.get(row.dataset.key);
  if (!item) return;

  if (act === "approve") {
    approveEntry(item, button);
    return;
  }
  if (act === "edit") {
    openEditor(item);
    return;
  }
  if (act === "del") {
    showConfirm(
      "删除词条",
      `确定删除「${item.content}」？删了就找不回来了。`,
      "删除",
      () => deleteEntry(item),
      true,
    );
  }
});

function syncBulk() {
  const isPending = state.bucket === "pending" && state.items.size > 0;
  $("bulkbar").hidden = !isPending;
  if (!isPending) {
    $("pickInfo").textContent = "已选 0 条";
    $("pickAll").checked = false;
    $("pickAll").indeterminate = false;
    $("bulkApprove").disabled = true;
    $("bulkDelete").disabled = true;
    return;
  }
  const count = state.selected.size;
  $("pickInfo").textContent = `已选 ${count} 条`;
  $("bulkApprove").disabled = count === 0;
  $("bulkDelete").disabled = count === 0;
  const picks = $$("#list .entry-pick input");
  $("pickAll").checked = picks.length > 0 && picks.every((box) => box.checked);
  $("pickAll").indeterminate = count > 0 && !$("pickAll").checked;
}

$("pickAll").addEventListener("change", () => {
  const on = $("pickAll").checked;
  state.selected.clear();
  $$("#list .entry").forEach((row) => {
    const box = row.querySelector(".entry-pick input");
    if (!box) return;
    box.checked = on;
    row.classList.toggle("picked", on);
    if (on) state.selected.add(row.dataset.key);
  });
  syncBulk();
});

async function bulkAction(action) {
  const items = Array.from(state.selected).map((key) => {
    const item = state.items.get(key);
    return item ? { table: item.table, name: item.content, scope: item.scope || "" } : null;
  }).filter(Boolean);
  if (!items.length) return;
  const data = await req("bulk", { action, items });
  toast(data.message || "完成", "ok");
  await refresh();
}

$("bulkApprove").addEventListener("click", async () => {
  const button = $("bulkApprove");
  button.disabled = true;
  try { await bulkAction("approve"); } catch (error) { toast(error.message, "bad"); syncBulk(); }
});

$("bulkDelete").addEventListener("click", () => {
  const count = state.selected.size;
  if (!count) return;
  showConfirm(
    "删除所选",
    `确定删除选中的 ${count} 条待审吗？删了就找不回来了。`,
    "删除",
    async () => {
      try { await bulkAction("delete"); } catch (error) { toast(error.message, "bad"); syncBulk(); }
    },
    true,
  );
});

/* ---------- 录入 / 修改 ---------- */

function updateCounter() {
  const text = $("fMeaning").value || "";
  const length = Array.from(text).length;
  const over = length > state.limit;
  $("fCount").textContent = `${length}/${state.limit}`;
  $("fCount").classList.toggle("over", over);
  $("editSave").disabled = over || !text.trim() || !$("fName").value.trim();
}

function setNameError(message) {
  const input = $("fName");
  const err = $("fNameErr");
  if (!input || !err) return;
  input.classList.toggle("invalid", Boolean(message));
  input.setAttribute("aria-invalid", message ? "true" : "false");
  err.textContent = message || "";
  if (message) {
    input.focus();
    input.select();
  }
}

function clearDuplicateWarning() {
  if (pendingDuplicate) {
    pendingDuplicate = null;
    $("editSave").textContent = "确认";
  }
  $("editHint").textContent = "";
}

function renderScopePicker(current) {
  const host = $("fScopeHost");
  scopePicker = null;
  if (!host) return;
  host.replaceChildren();
  scopePicker = makeSelect({
    id: "fScope",
    label: "作用域",
    value: current || "__global__",
    items: scopeItems(current || "__global__"),
  });
  scopePicker.addEventListener("change", () => {
    clearDuplicateWarning();
    setNameError("");
  });
  host.append(scopePicker);
}

function openEditor(item) {
  state.editing = item || null;
  pendingDuplicate = null;
  $("editSave").textContent = "确认";
  const editing = Boolean(item);
  $("editTitle").textContent = editing ? "修改词条" : "手动录入";
  $("editSub").textContent = editing
    ? "改完直接生效；改名或改作用域会做重名检查。"
    : "录入的词条会直接进「手动」，参与注入。";
  const scope = item ? item.scope : (state.scoped ? state.scope : "");
  $("fName").value = item ? item.content : "";
  $("fKeywords").value = item ? (item.keywords || "") : "";
  $("fMeaning").value = item ? (item.meaning || "") : "";
  renderScopePicker(scope);
  setNameError("");
  $("editHint").textContent = "";
  updateCounter();
  openMask($("editMask"));
  setTimeout(() => {
    $("fName").focus();
    if (editing) $("fName").select();
  }, 60);
}

$("addBtn").addEventListener("click", () => openEditor(null));
$("fMeaning").addEventListener("input", updateCounter);
$("fName").addEventListener("input", () => {
  updateCounter();
  setNameError("");
});
for (const id of ["fName", "fKeywords", "fMeaning"]) {
  $(id).addEventListener("input", clearDuplicateWarning);
  $(id).addEventListener("change", clearDuplicateWarning);
}

$("editMask").addEventListener("close", () => setNameError(""));

$("editSave").addEventListener("click", async () => {
  const name = $("fName").value.trim();
  const meaning = $("fMeaning").value.trim();
  const keywords = $("fKeywords").value.trim();
  const raw = scopePicker ? scopePicker.value : "__global__";
  const scope = raw === "__global__" ? "" : raw;
  if (!name || !meaning) { toast("词条名和内容都要填", "bad"); return; }

  const button = $("editSave");
  button.disabled = true;
  try {
    if (state.editing) {
      const item = state.editing;
      const data = await req("update", {
        table: item.table, old_name: item.content, old_scope: item.scope || "",
        name, meaning, keywords, scope,
      });
      closeMask($("editMask"));
      toast(data.message || "已更新", "ok");
      state.editing = null;
      await refresh();    } else if (pendingDuplicate) {
      pendingDuplicate = null;
      $("editSave").textContent = "确认";
      await submitAdd(name, meaning, keywords, scope);
    } else {
      const dup = await req("lookup", { name, scope });
      const manual = (dup.items || []).find((x) => x.source === "manual");
      if (manual) {
        const side = manual.table === "manual" ? "手动" : "手动待审";
        setNameError(`同名${side}词条「${name}」已存在；要改内容请用「修改」。`);
        $("editHint").textContent = "";
        toast(`同名词条「${name}」已存在`, "bad");
        button.disabled = false;
        return;
      }
      const auto = (dup.items || []).find((x) => x.source !== "manual");
      if (auto) {
        pendingDuplicate = { name, meaning, keywords, scope };
        $("editSave").textContent = "仍要新建";
        $("editHint").textContent = `黑话库已有同名条目「${name}」：${(auto.meaning || "").slice(0, 60)}… 再点一次就在「手动」里新建，不覆盖原条目。`;
        toast("黑话库已有同名条目，再点一次确认", "bad");
        button.disabled = false;
        return;
      }
      await submitAdd(name, meaning, keywords, scope);
    }
  } catch (error) {
    $("editHint").textContent = error.message;
    toast(error.message, "bad");
    button.disabled = false;
  }
});

async function submitAdd(name, meaning, keywords, scope) {
  try {
    const data = await req("add", { name, content: name, meaning, keywords, scope });
    closeMask($("editMask"));
    toast(data.message || "已录入", "ok");
    state.editing = null;
    pendingDuplicate = null;
    $("editSave").textContent = "确认";
    await refresh();
  } catch (error) {
    $("editHint").textContent = error.message;
    toast(error.message, "bad");
    $("editSave").disabled = false;
  } finally {
    updateCounter();
  }
}

/* ---------- 设置 ---------- */

let settingFields = [];
let settingReaders = {};

function settingControl(field, value) {
  const wrap = document.createElement("div");
  wrap.className = "field";
  wrap.dataset.field = field.key;
  if (field.multiline) wrap.classList.add("field-wide");

  const head = document.createElement("div");
  head.className = "field-head";
  const label = document.createElement("label");
  label.textContent = field.label || field.key;
  const id = `s-${field.key}`;
  label.htmlFor = id;
  const key = document.createElement("span");
  key.className = "key";
  key.textContent = field.key;
  head.append(label, key);
  wrap.append(head);

  let read;
  if (field.type === "bool") {
    const row = document.createElement("div");
    row.className = "switch-row";
    const input = document.createElement("input");
    input.type = "checkbox";
    input.role = "switch";
    input.className = "input";
    input.id = id;
    input.checked = Boolean(value);
    const stateNode = document.createElement("span");
    stateNode.className = "state";
    stateNode.textContent = input.checked ? "开" : "关";
    input.addEventListener("change", () => { stateNode.textContent = input.checked ? "开" : "关"; });
    row.append(input, stateNode);
    wrap.append(row);
    read = () => input.checked;
  } else if ((field.type === "options" || field.type === "select")
      && Array.isArray(field.options) && field.options.length) {
    const labels = Array.isArray(field.labels) ? field.labels : [];
    const current = value === null || value === undefined ? "" : String(value);
    const items = field.options.map((option, index) => ({
      value: String(option),
      label: labels[index] || String(option),
    }));
    if (current && !items.some((item) => item.value === current)) {
      items.push({ value: current, label: current });
    }
    const select = makeSelect({
      id,
      label: field.label || field.key,
      value: current,
      items,
    });
    wrap.append(select);
    read = () => select.value;
  } else if (field.multiline) {
    const area = document.createElement("textarea");
    area.id = id;
    area.className = "textarea";
    area.rows = field.rows || 3;
    area.value = value === null || value === undefined ? "" : String(value);
    wrap.append(area);
    read = () => area.value;
  } else {
    const input = document.createElement("input");
    input.className = "input";
    input.id = id;
    input.type = field.type === "number" ? "number" : "text";
    if (field.min !== undefined) input.min = field.min;
    if (field.max !== undefined) input.max = field.max;
    if (field.step !== undefined) input.step = field.step;
    input.value = value === null || value === undefined ? "" : String(value);
    wrap.append(input);
    read = () => (field.type === "number" ? Number(input.value) : input.value);
  }
  if (field.help) {
    const hint = document.createElement("p");
    hint.className = "hint";
    hint.textContent = field.help;
    wrap.append(hint);
  }
  settingReaders[field.key] = read;
  return wrap;
}

function applySettingConditions() {
  const body = $("settingsBody");
  for (const field of settingFields) {
    const condition = field.show_if;
    if (!condition || !condition.key) continue;
    const node = body.querySelector(`[data-field="${field.key}"]`);
    const read = settingReaders[condition.key];
    if (!node || !read) continue;
    const wanted = condition.value;
    const value = read();
    const match = Array.isArray(wanted)
      ? wanted.map(String).includes(String(value))
      : String(value) === String(wanted);
    node.hidden = !match;
  }
}

function renderSettings(fields, values) {
  settingFields = fields;
  settingReaders = {};
  const body = $("settingsBody");
  body.replaceChildren();
  if (!fields.length) {
    body.innerHTML = `<p class="hint">这个插件没有可改的设置。</p>`;
    $("settingsSave").disabled = false;
    return;
  }
  const groups = [];
  for (const field of fields) {
    const key = field.group || "";
    let group = groups.find((item) => item.key === key);
    if (!group) {
      group = { key, label: field.group_label || "", fields: [] };
      groups.push(group);
    }
    group.fields.push(field);
  }
  for (const group of groups) {
    const section = document.createElement("section");
    section.className = "dialog-group";
    if (group.label) {
      const title = document.createElement("h4");
      title.className = "dialog-group-title";
      title.textContent = group.label;
      section.append(title);
    }
    const grid = document.createElement("div");
    grid.className = "dialog-grid";
    for (const field of group.fields) {
      grid.append(settingControl(field, values ? values[field.key] : undefined));
    }
    section.append(grid);
    body.append(section);
  }
  body.oninput = applySettingConditions;
  body.onchange = applySettingConditions;
  applySettingConditions();
  $("settingsSave").disabled = false;
}

async function openSettings() {
  $("settingsHint").textContent = "";
  $("settingsBody").innerHTML = `<p class="hint">读取中…</p>`;
  settingFields = [];
  settingReaders = {};
  $("settingsSave").disabled = true;
  openMask($("settingsMask"));
  try {
    const res = await fetch(`/api/plugins/${PLUGIN_ID}/settings`, { cache: "no-store" });
    let data = null;
    try { data = await res.json(); } catch (error) { /* 下面统一报错 */ }
    if (!data) throw new Error(`服务器返回了 ${res.status}`);
    if (!res.ok || data.ok === false) throw new Error(data.message || `读取失败（${res.status}）`);
    if (!$("settingsMask").open) return;
    renderSettings(data.fields || [], data.values || {});
  } catch (error) {
    if (!$("settingsMask").open) return;
    $("settingsBody").innerHTML = `<p class="hint">读取设置失败：${esc(error.message)}</p>`;
  }
}

$("settingsBtn").addEventListener("click", openSettings);

$("settingsSave").addEventListener("click", async () => {
  const values = {};
  for (const [key, read] of Object.entries(settingReaders)) values[key] = read();
  const button = $("settingsSave");
  button.disabled = true;
  $("settingsHint").textContent = "";
  try {
    const res = await fetch(`/api/plugins/${PLUGIN_ID}/settings`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ values }),
    });
    let data = null;
    try { data = await res.json(); } catch (error) { /* 下面统一报错 */ }
    if (!data) throw new Error(`服务器返回了 ${res.status}`);
    if (!res.ok || data.ok === false) throw new Error(data.message || "保存失败");
    closeMask($("settingsMask"));
    toast(data.message || "设置已保存", "ok");
    await refresh();
  } catch (error) {
    $("settingsHint").textContent = error.message;
  } finally {
    button.disabled = false;
  }
});

/* ---------- 主题 / 顶栏 / 快捷键 ---------- */

function paintTheme(theme) {
  const html = document.documentElement;
  html.setAttribute("data-theme", theme);
  html.style.colorScheme = theme;
  html.classList.toggle("dark", theme === "dark");
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", theme === "dark" ? "#0a0f1a" : "#f9fcfe");
  const button = $("theme");
  if (button) {
    button.textContent = theme === "dark" ? "◑" : "◐";
    button.title = theme === "dark" ? "切到浅色" : "切到深色";
    button.setAttribute("aria-label", theme === "dark" ? "切换到浅色主题" : "切换到深色主题");
  }
}

function initTheme() {
  const button = $("theme");
  if (!button) return;
  paintTheme(document.documentElement.getAttribute("data-theme") || "light");
  button.addEventListener("click", (event) => {
    const current = document.documentElement.getAttribute("data-theme") || "light";
    const next = current === "dark" ? "light" : "dark";
    const x = event.clientX ?? window.innerWidth / 2;
    const y = event.clientY ?? 40;
    const radius = Math.hypot(Math.max(x, window.innerWidth - x), Math.max(y, window.innerHeight - y));
    const root = document.documentElement;
    root.style.setProperty("--vt-x", x + "px");
    root.style.setProperty("--vt-y", y + "px");
    root.style.setProperty("--vt-r", radius + "px");

    if (typeof document.startViewTransition !== "function" || reducedMotion()) {
      paintTheme(next);
      return;
    }
    document.startViewTransition(() => paintTheme(next));
    button.animate(
      [{ transform: "rotate(0deg)" }, { transform: "rotate(180deg)" }],
      { duration: 240, easing: "cubic-bezier(.22, 1.15, .36, 1)" },
    );
  });
}

function initTopbar() {
  const bar = $("topbar");
  if (!bar) return;
  let ticking = false;
  const update = () => {
    bar.classList.toggle("is-scrolled", window.scrollY > 8);
    ticking = false;
  };
  window.addEventListener(
    "scroll",
    () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(update);
    },
    { passive: true },
  );
  update();
}

function initFullscreen() {
  const button = $("full");
  if (!button) return;
  button.addEventListener("click", () => {
    if (document.fullscreenElement) {
      document.exitFullscreen().catch(() => {});
    } else if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(() => {});
    }
  });
}

function isTyping(node) {
  if (!node) return false;
  const tag = node.tagName;
  return tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || node.isContentEditable;
}

function initEvents() {
  $("search").addEventListener("input", (event) => {
    clearTimeout(searchTimer);
    const value = event.target.value.trim();
    searchTimer = setTimeout(() => {
      state.search = value;
      state.page = 1;
      loadList({ direction: 0 });
    }, 260);
  });

  document.addEventListener("keydown", (event) => {
    if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "s") {
      if ($("settingsMask").open) { event.preventDefault(); $("settingsSave").click(); return; }
      if ($("editMask").open) { event.preventDefault(); $("editSave").click(); return; }
    }
    if (event.key === "/" && !event.ctrlKey && !event.metaKey && !event.altKey) {
      if (isTyping(event.target) || document.querySelector("dialog[open]")) return;
      event.preventDefault();
      $("search").focus();
    }
  });

  window.addEventListener("resize", () => {
    moveInk(false);
    placeScopeInk(null, false);
  });
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") {
      moveInk(false);
      placeScopeInk(null, false);
      refreshStatus();
    }
  });
}

/* ---------- 状态 ---------- */

function setBadge(kind, text, title) {
  const badge = $("status-badge");
  badge.classList.remove("off", "warn");
  if (kind) badge.classList.add(kind);
  badge.title = title || text;
  $("status-text").textContent = text;
}

async function refreshStatus() {
  try {
    const info = await req("ping");
    state.limit = info.limit || 200;
    let kind = "";
    let text = "自动学习";
    let title = "自动学习已开启";
    if (!info.enabled) {
      kind = "off";
      text = "已停止";
      title = "插件已停用：不学习也不注入";
    } else if (!info.auto_learn) {
      kind = "warn";
      text = "只注入";
      title = "自动学习已关闭，只做注入";
    } else if (info.learning) {
      text = "学习中";
      title = "正在提取或自审";
    }
    setBadge(kind, text, title);
    $("stat-line").textContent = `${fmtNum(info.rows)} 条 · 缓冲 ${fmtNum(info.buffer)}`;
    $("foot-state").textContent =
      `自检 ok · 手动 ${fmtNum(info.manual)} / 黑话 ${fmtNum(info.auto)} / 待审 ${fmtNum(info.pending)} / 梗百科 ${fmtNum(info.wiki)}` +
      (info.learning ? " · 学习中" : "");
    if (info.version) $("brand-version").textContent = `v${info.version}`;
    if (state.statusDown) {
      state.statusDown = false;
      toast("自检恢复", "ok");
    }
  } catch (error) {
    setBadge("off", "自检失败", error.message);
    $("stat-line").textContent = "";
    $("foot-state").textContent = `自检失败：${error.message}`;
    if (!state.statusDown) {
      state.statusDown = true;
      toast(`自检失败：${error.message}`, "bad");
    }
  }
}

/* ---------- 数据 ---------- */

async function loadTree() {
  const data = await req("tree");
  data.buckets = data.buckets || [];
  state.tree = data;
  state.names = {};
  data.buckets.forEach((bucket) => {
    (bucket.subs || []).forEach((sub) => {
      if (sub.scope && sub.name) state.names[sub.scope] = sub.name;
    });
  });
  const keys = data.buckets.map((bucket) => bucket.key);
  if (!keys.includes(state.bucket)) state.bucket = keys[0] || "manual";
  if (state.scoped) {
    const bucket = data.buckets.find((item) => item.key === state.bucket);
    const subs = (bucket && bucket.subs) || [];
    if (!subs.some((sub) => sub.scope === state.scope)) {
      state.scoped = false;
      state.scope = "";
    }
  }
  renderTabs();
  renderScopes();
  syncListTools();
  paintHead(false);
}

async function refresh() {
  try {
    await loadTree();
  } catch (error) {
    toast(`分类读取失败：${error.message}`, "bad");
  }
  await loadList({ direction: 0 });
  await refreshStatus();
}

/* ---------- 启动 ---------- */

async function boot() {
  initTheme();
  initTopbar();
  initFullscreen();
  initSortPicker();
  initEvents();

  const params = new URLSearchParams(location.search);
  const wantBucket = params.get("bucket");
  if (wantBucket && ORDER.includes(wantBucket)) state.bucket = wantBucket;
  if (params.get("new") === "1") state.bucket = "manual";
  if (params.has("scope")) {
    const raw = params.get("scope") || "";
    state.scope = raw === "__global__" ? "" : raw;
    state.scoped = true;
  }
  syncListTools();
  paintHead(false);

  updateCounter();
  await refreshStatus();
  setInterval(() => {
    if (document.visibilityState === "visible") refreshStatus();
  }, 15000);

  try {
    await loadTree();
  } catch (error) {
    $("list-meta").textContent = "读取失败";
    $("list").innerHTML = `<div class="blank-card">分类读取失败：${esc(error.message)}
      <div class="blank-action"><button class="btn" data-variant="outline" data-size="sm" type="button" data-act="retry">重试</button></div>
    </div>`;
    return;
  }

  await loadList({ direction: 0 });
  if (params.get("new") === "1" && state.bucket === "manual") openEditor(null);
  else if (params.get("settings") === "1") openSettings();
}

boot();
</script>
