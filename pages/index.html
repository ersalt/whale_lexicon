<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f4f7fb">
<title>鲸语汇</title>
<script>
  // 主题跟主面板共用一份选择，免得一个亮一个暗
  (function () {
    try {
      var saved = localStorage.getItem("qqbotlite-theme");
      var query = new URLSearchParams(location.search).get("theme");
      var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      var theme = query === "dark" || query === "light" ? query : saved || (prefersDark ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    } catch (error) {}
  })();
</script>
<link rel="stylesheet" href="/static/style.css">
<style>
/* 布局照 astrbot_plugin_slang 的 pages/yh/index.html：左边一张卡、右边一张卡。
   配色和控件走 /static/style.css 的令牌，跟主面板一致。 */

.page { max-width: 1160px; padding: 24px 20px 72px; }
.split-layout { grid-template-columns: 252px minmax(0, 1fr); gap: 14px; align-items: start; }
.split-main {
  gap: 0;
  min-width: 0;
  min-height: calc(100vh - 48px);
  align-content: start;
  padding: 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--card);
  box-shadow: var(--shadow-card);
}

/* ---------- 左栏 ---------- */
.split-side { padding: 16px 14px; gap: 12px; position: sticky; top: 24px; }
.side-title {
  margin: 2px 4px 4px;
  font-size: 15px;
  font-weight: 650;
  line-height: 1.3;
}
.side-title small {
  display: block;
  margin-top: 2px;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 400;
  color: var(--muted-foreground);
}

.nav-list { display: grid; gap: 4px; }
.nav-item {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 8px 12px;
  border: 1px solid transparent;
  border-radius: var(--radius-control);
  background: transparent;
  color: var(--muted-foreground);
  font: inherit;
  font-size: 13.5px;
  font-weight: 600;
  text-align: left;
  cursor: pointer;
  transition: background .14s ease, color .14s ease, border-color .14s ease;
}
.nav-item:hover { background: var(--muted); color: var(--foreground); }
.nav-item.active { background: var(--accent); color: var(--accent-foreground); }
.nav-caret { width: 10px; font-size: 10px; opacity: .55; flex: none; text-align: center; }
.nav-caret.blank { visibility: hidden; }
.nav-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-count {
  flex: none;
  min-width: 22px;
  height: 20px;
  padding: 0 7px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  background: var(--muted);
  color: var(--muted-foreground);
  font-family: var(--mono);
  font-size: 10.5px;
  line-height: 1;
}
.nav-item.active .nav-count { background: color-mix(in oklab, var(--accent-foreground) 14%, transparent); color: var(--accent-foreground); }

.nav-subs { display: grid; gap: 2px; padding: 2px 0 6px 10px; }
.nav-sub {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  min-height: 40px;
  padding: 4px 8px 4px 10px;
  border: 0;
  border-left: 2px solid var(--border);
  border-radius: 0 var(--radius-control) var(--radius-control) 0;
  background: transparent;
  color: var(--muted-foreground);
  font: inherit;
  font-size: 12.5px;
  text-align: left;
  cursor: pointer;
  transition: background .14s ease, color .14s ease, border-color .14s ease;
}
.nav-sub:hover { background: var(--muted); color: var(--foreground); }
.nav-sub.active { background: var(--accent); border-left-color: var(--ring); color: var(--accent-foreground); }
.nav-sub-label { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.nav-sub-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
.nav-sub-id { font-family: var(--mono); font-size: 10.5px; opacity: .8; white-space: nowrap; }
.nav-sub-count { font-family: var(--mono); font-size: 10.5px; opacity: .8; flex: none; }
.nav-subs:empty { display: none; }

.side-foot {
  margin-top: auto;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  padding-top: 6px;
}
.side-diag {
  font-family: var(--mono);
  font-size: 10.5px;
  line-height: 1.7;
  color: var(--muted-foreground);
  white-space: pre-line;
  word-break: break-word;
}
.side-foot .icon-btn { flex: none; }

/* ---------- 右栏 ---------- */
.toolbar { margin: 0 0 14px; align-items: flex-end; gap: 12px; }
.toolbar h1 { font-size: 20px; }
.toolbar h1 span { margin-left: 6px; font-size: 12px; font-weight: 400; color: var(--muted-foreground); }
.toolbar-actions { align-items: center; flex-wrap: wrap; gap: 10px; }
.toolbar-actions select { width: 114px; flex: none; }
.toolbar-actions .btn { flex: none; }
.ctl-search { width: 220px; flex: 1 1 160px; min-width: 0; }

.bulkbar {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 0 0 12px;
  padding: 8px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-control);
  background: var(--card);
  font-size: 12.5px;
  color: var(--muted-foreground);
}
.bulkbar label { display: flex; align-items: center; gap: 7px; cursor: pointer; }
.bulkbar input[type="checkbox"] { width: 14px; height: 14px; margin: 0; accent-color: var(--primary); }
.bulkbar .spacer { flex: 1; }
.bulkbar .btn { height: 28px; padding: 0 12px; font-size: 12.5px; }
.btn-danger { color: var(--destructive); border-color: color-mix(in oklab, var(--destructive) 32%, var(--border)); }
.btn-danger:hover { border-color: var(--destructive); background: color-mix(in oklab, var(--destructive) 8%, var(--card)); }
.btn-danger:disabled { color: var(--muted-foreground); border-color: var(--border); background: var(--card); }

/* ---------- 词条 ---------- */
.entries { display: grid; gap: 8px; }
.entry {
  display: grid;
  grid-template-columns: minmax(64px, 110px) minmax(0, 1fr) 172px;
  gap: 12px;
  align-items: center;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: color-mix(in oklab, var(--muted) 55%, var(--card));
  box-shadow: none;
  transition: border-color .14s ease;
}
.entry:hover { border-color: color-mix(in oklab, var(--border) 55%, var(--muted-foreground)); }
.entry.picked { border-color: var(--ring); background: color-mix(in oklab, var(--accent) 32%, var(--card)); }
.entry.pending { grid-template-columns: 26px minmax(64px, 110px) minmax(0, 1fr) 172px; }
.entry-pick { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 5px; }
.entry-pick:hover { background: var(--muted); }
.entry-pick input { width: 15px; height: 15px; margin: 0; accent-color: var(--primary); cursor: pointer; }
.entry-name { font-size: 14px; font-weight: 650; line-height: 1.4; word-break: break-word; }
.entry-body { min-width: 0; }
.entry-meaning { margin: 0; font-size: 13px; line-height: 1.55; color: var(--foreground); word-break: break-word; }
.entry-meaning.empty { color: var(--muted-foreground); }
.entry-meta {
  margin: 3px 0 0;
  font-size: 11.5px;
  color: var(--muted-foreground);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.entry.is-wiki .entry-meaning {
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.entry-ops { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.entry-ops .btn {
  height: 28px;
  padding: 0 2px;
  font-size: 11.5px;
  border-radius: 8px;
  box-shadow: none;
  white-space: nowrap;
}
.entry-ops .btn.on {
  background: color-mix(in oklab, var(--success) 14%, var(--card));
  border-color: color-mix(in oklab, var(--success) 38%, var(--border));
  color: color-mix(in oklab, var(--success) 55%, var(--foreground));
}
.entry-ops .btn.armed { background: var(--destructive); border-color: transparent; color: #fff; }
.entry.is-wiki .entry-ops .btn { grid-column: 1 / -1; }

.empty { padding: 56px 20px; border: 1px dashed var(--border); border-radius: var(--radius); color: var(--muted-foreground); font-size: 13px; text-align: center; }

.pager { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 16px; font-size: 12.5px; color: var(--muted-foreground); }
.pager .btn { height: 28px; padding: 0 12px; font-size: 12.5px; }

/* ---------- 弹窗 ---------- */
.dialog { width: min(520px, 100%); }
.form-field { display: grid; gap: 6px; margin-bottom: 14px; }
.form-field > label { font-size: 12.5px; font-weight: 500; }
.label-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.counter { font-family: var(--mono); font-size: 10.5px; color: var(--muted-foreground); }
.counter.over { color: var(--destructive); font-weight: 600; }
textarea.ctl {
  width: 100%;
  min-height: 92px;
  font: inherit;
  font-size: 13px;
  line-height: 1.6;
  color: var(--foreground);
  background: var(--card);
  border: 1px solid var(--input);
  border-radius: var(--radius-control);
  padding: 8px 11px;
  resize: vertical;
}
textarea.ctl:focus { outline: none; border-color: var(--ring); box-shadow: 0 0 0 3px color-mix(in oklab, var(--ring) 22%, transparent); }
.dialog-foot .btn { box-shadow: none; }
.confirm-text { margin: 0; font-size: 13px; line-height: 1.7; color: var(--foreground); white-space: pre-wrap; }

@media (max-width: 900px) {
  .split-layout { grid-template-columns: 1fr; }
  .split-side { position: static; }
  .entry, .entry.pending {
    grid-template-columns: minmax(64px, 110px) minmax(0, 1fr);
    grid-template-areas: "name body" "ops ops";
    row-gap: 10px;
  }
  .entry.pending {
    grid-template-columns: 26px minmax(64px, 110px) minmax(0, 1fr);
    grid-template-areas: "pick name body" "ops ops ops";
  }
  .entry > .entry-pick { grid-area: pick; }
  .entry-name { grid-area: name; }
  .entry-body { grid-area: body; }
  .entry-ops { grid-area: ops; }
  .toolbar { align-items: stretch; }
  .toolbar-actions { width: 100%; }
  .ctl-search { width: auto; }
}
</style>
</head>
<body>
<div class="page">
  <div class="split-layout">

    <aside class="split-side">
      <h1 class="side-title">鲸语汇<small>whale_lexicon</small></h1>
      <div class="nav-list" id="nav"></div>
      <div class="side-foot">
        <div class="side-diag" id="diag">读取中…</div>
        <button class="icon-btn" id="theme" type="button" aria-label="切换主题">◐</button>
      </div>
    </aside>

    <main class="split-main">
      <div class="toolbar">
        <div class="toolbar-text">
          <h1 id="title">手动<span id="subtitle"></span></h1>
        </div>
        <div class="toolbar-actions">
          <select id="sort" title="排序方式">
            <option value="recent">最新优先</option>
            <option value="count">次数优先</option>
          </select>
          <input type="text" id="search" class="ctl-search" placeholder="搜索词条或含义…（/ 聚焦）" autocomplete="off">
          <button class="btn btn-primary" type="button" id="addBtn">+ 手动录入</button>
        </div>
      </div>

      <div class="bulkbar" id="bulkbar" hidden>
        <label><input type="checkbox" id="pickAll"> 全选本页</label>
        <span id="pickInfo">已选 0 条</span>
        <span class="spacer"></span>
        <button class="btn btn-sm" type="button" id="bulkApprove" disabled>通过所选</button>
        <button class="btn btn-sm btn-danger" type="button" id="bulkDelete" disabled>删除所选</button>
      </div>

      <div class="entries" id="list"></div>
      <div class="pager" id="pager" hidden></div>
    </main>
  </div>
</div>

<!-- 录入 / 修改 -->
<div class="overlay" id="editMask" hidden>
  <div class="dialog">
    <div class="dialog-head">
      <h2 id="editTitle">手动录入</h2>
      <button class="icon-btn" type="button" data-close aria-label="关闭">×</button>
    </div>
    <p class="dialog-sub" id="editSub">录入的词条会直接进「手动」，参与注入。</p>
    <div class="dialog-body">
      <div class="form-field">
        <label for="fName">词条名</label>
        <input type="text" id="fName" maxlength="32" autocomplete="off" placeholder="例如：梁文锋">
      </div>
      <div class="form-field">
        <label for="fKeywords">关键词</label>
        <input type="text" id="fKeywords" maxlength="300" autocomplete="off" placeholder="触发词，逗号分隔；不填就只用词条名">
      </div>
      <div class="form-field">
        <div class="label-row">
          <label for="fMeaning">内容</label>
          <span class="counter" id="fCount">0/200</span>
        </div>
        <textarea class="ctl" id="fMeaning" placeholder="注入给模型的解释，一句话就够"></textarea>
      </div>
      <div class="form-field">
        <label for="fScope">作用域</label>
        <select id="fScope"></select>
      </div>
      <p class="hint" id="editHint"></p>
    </div>
    <div class="dialog-foot">
      <button class="btn" type="button" data-close>取消</button>
      <button class="btn btn-primary" type="button" id="editSave">确认</button>
    </div>
  </div>
</div>

<!-- 二次确认 -->
<div class="overlay" id="confirmMask" hidden>
  <div class="dialog" style="width:min(420px,100%)">
    <div class="dialog-head">
      <h2 id="confirmTitle">确认</h2>
      <button class="icon-btn" type="button" data-close aria-label="关闭">×</button>
    </div>
    <div class="dialog-body">
      <p class="confirm-text" id="confirmText"></p>
    </div>
    <div class="dialog-foot">
      <button class="btn" type="button" data-close>取消</button>
      <button class="btn btn-primary" type="button" id="confirmOk">确定</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

const $ = (id) => document.getElementById(id);
const LABELS = { manual: "手动", auto: "黑话库", pending: "待审", wiki: "梗百科" };

const state = {
  // 顺序跟原插件一致：手动 → 黑话库 → 待审 → 梗百科，默认落在「手动」
  bucket: "manual",
  scope: "",
  scoped: false,
  search: "",
  sort: "recent",
  page: 1,
  size: 50,
  tree: null,
  names: {},
  items: new Map(),
  selected: new Set(),
  collapsed: new Set(),
  limit: 200,
  editing: null,
  confirmHandler: null,
};

/* ---------- 基础 ---------- */

function esc(value) {
  return String(value === null || value === undefined ? "" : value)
    .replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}

function fmtDate(ts) {
  if (!ts) return "";
  const d = new Date(Number(ts) * 1000);
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

/** group:123456 → 123456；面板上只显示号码，跟原插件一致 */
function scopeId(scope) {
  const at = scope.lastIndexOf(":");
  return at >= 0 ? scope.slice(at + 1) : scope;
}

function scopeName(scope) {
  if (!scope) return "全局";
  return state.names[scope] || `群 ${scopeId(scope)}`;
}

function toast(message, kind) {
  const node = $("toast");
  node.textContent = message;
  node.className = "toast show" + (kind ? " " + kind : "");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { node.className = "toast"; }, 2600);
}

async function req(path, body) {
  const init = body === undefined ? {} : {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  };
  const res = await fetch("./" + path, init);
  let data = null;
  try { data = await res.json(); } catch (error) { /* 非 JSON 时下面统一报错 */ }
  if (!data) throw new Error(`服务器返回了 ${res.status}`);
  if (!res.ok || data.ok === false) throw new Error(data.message || `请求失败（${res.status}）`);
  return data;
}

/* ---------- 弹窗 ---------- */

function openMask(node) {
  node.hidden = false;
  requestAnimationFrame(() => node.classList.add("show"));
}

function closeMask(node) {
  node.classList.remove("show");
  setTimeout(() => { node.hidden = true; }, 160);
}

function showConfirm(title, text, okLabel, onOk) {
  $("confirmTitle").textContent = title;
  $("confirmText").textContent = text;
  $("confirmOk").textContent = okLabel || "确定";
  state.confirmHandler = onOk;
  openMask($("confirmMask"));
}

$("confirmOk").addEventListener("click", async () => {
  const handler = state.confirmHandler;
  state.confirmHandler = null;
  closeMask($("confirmMask"));
  if (handler) await handler();
});

document.querySelectorAll("[data-close]").forEach((node) => {
  node.addEventListener("click", () => closeMask(node.closest(".overlay")));
});

document.querySelectorAll(".overlay").forEach((mask) => {
  mask.addEventListener("click", (event) => {
    if (event.target === mask) closeMask(mask);
  });
});

/* ---------- 侧栏 ---------- */

function renderNav() {
  const tree = state.tree;
  if (!tree) return;
  $("nav").innerHTML = tree.buckets.map((bucket) => {
    const active = state.bucket === bucket.key && !state.scoped ? " active" : "";
    const hasSubs = bucket.subs && bucket.subs.length;
    const collapsed = state.collapsed.has(bucket.key);
    const caret = hasSubs
      ? `<span class="nav-caret" data-caret="${esc(bucket.key)}">${collapsed ? "▸" : "▾"}</span>`
      : `<span class="nav-caret blank"></span>`;
    let html = `<button class="nav-item${active}" type="button" data-bucket="${esc(bucket.key)}">
      ${caret}
      <span class="nav-label">${esc(bucket.label)}</span>
      <span class="nav-count">${bucket.count}</span>
    </button>`;
    if (hasSubs && !collapsed) {
      html += `<div class="nav-subs">` + bucket.subs.map((sub) => {
        const on = state.bucket === bucket.key && state.scoped && state.scope === sub.scope ? " active" : "";
        const name = sub.scope ? (sub.name || "未命名群") : "全局";
        const id = sub.scope ? `[${esc(scopeId(sub.scope))}]` : "所有群通用";
        return `<button class="nav-sub${on}" type="button"
          data-bucket="${esc(bucket.key)}" data-scope="${esc(sub.scope)}">
          <span class="nav-sub-label">
            <span class="nav-sub-name">${esc(name)}</span>
            <span class="nav-sub-id">${esc(id)}</span>
          </span>
          <span class="nav-sub-count">${sub.count}</span>
        </button>`;
      }).join("") + `</div>`;
    }
    return html;
  }).join("");
}

$("nav").addEventListener("click", (event) => {
  const caret = event.target.closest("[data-caret]");
  if (caret) {
    const key = caret.dataset.caret;
    if (state.collapsed.has(key)) state.collapsed.delete(key);
    else state.collapsed.add(key);
    renderNav();
    return;
  }
  const sub = event.target.closest(".nav-sub");
  if (sub) {
    state.bucket = sub.dataset.bucket;
    state.scope = sub.dataset.scope || "";
    state.scoped = true;
    state.page = 1;
    state.search = "";
    $("search").value = "";
    renderNav();
    loadList();
    return;
  }
  const item = event.target.closest(".nav-item");
  if (!item) return;
  const key = item.dataset.bucket;
  if (state.bucket === key && !state.scoped) {
    const bucket = state.tree && state.tree.buckets.find((b) => b.key === key);
    if (bucket && bucket.subs && bucket.subs.length) {
      if (state.collapsed.has(key)) state.collapsed.delete(key);
      else state.collapsed.add(key);
      renderNav();
      return;
    }
  }
  state.bucket = key;
  state.scope = "";
  state.scoped = false;
  state.collapsed.delete(key);
  state.page = 1;
  state.search = "";
  $("search").value = "";
  renderNav();
  loadList();
});

/* ---------- 列表 ---------- */

function titleOf() {
  const label = LABELS[state.bucket] || "全部";
  if (!state.scoped) return label;
  if (!state.scope) return `${label} · 全局`;
  const bucket = state.tree && state.tree.buckets.find((b) => b.key === state.bucket);
  const sub = bucket && bucket.subs.find((s) => s.scope === state.scope);
  const name = sub && sub.name ? sub.name : "群";
  return `${label} · ${name} [${scopeId(state.scope)}]`;
}

function scopeOptions(current) {
  const options = [`<option value="__global__">全局（所有群）</option>`];
  const seen = new Set();
  (state.tree ? state.tree.buckets : []).forEach((bucket) => {
    (bucket.subs || []).forEach((sub) => {
      if (!sub.scope || seen.has(sub.scope)) return;
      seen.add(sub.scope);
      const name = sub.name || "未命名群";
      options.push(`<option value="${esc(sub.scope)}">${esc(name)} [${esc(scopeId(sub.scope))}]</option>`);
    });
  });
  if (current && !seen.has(current)) {
    options.push(`<option value="${esc(current)}">${esc(scopeName(current))}</option>`);
  }
  return options.join("");
}

function entryHTML(item) {
  const name = item.content || "";
  if (item.read_only) {
    const tags = item.tags ? ` · ${esc(item.tags)}` : "";
    return `<article class="entry is-wiki" data-key="${esc(item.id)}">
      <div class="entry-name">${esc(name)}</div>
      <div class="entry-body">
        <p class="entry-meaning${item.meaning ? "" : " empty"}" title="${esc(item.meaning)}">${esc(item.meaning) || "（没有摘要）"}</p>
        <p class="entry-meta">梗百科 · 只读${tags}</p>
      </div>
      <div class="entry-ops"><button class="btn" type="button" disabled>只读</button></div>
    </article>`;
  }

  const pending = state.bucket === "pending";
  const picked = state.selected.has(item.id);
  const pick = pending
    ? `<label class="entry-pick">
         <input type="checkbox" ${picked ? "checked" : ""} aria-label="选择 ${esc(name)}">
       </label>`
    : "";
  const src = item.source === "manual" ? "手动" : "自动";
  const where = item.is_global ? "全局" : scopeName(item.scope);
  const who = item.contributor ? `来源：${esc(item.contributor)}` : "";
  const note = item.auto_note ? `理由：${esc(item.auto_note)}` : "";
  const meta = [src, where, who, `×${item.count || 1}`,
    item.updated_at ? fmtDate(item.updated_at) : "", note].filter(Boolean).join(" · ");
  const keywords = item.keywords ? `<p class="entry-meta">关键词：${esc(item.keywords)}</p>` : "";

  return `<article class="entry${pending ? " pending" : ""}${picked ? " picked" : ""}" data-key="${esc(item.id)}">
    ${pick}
    <div class="entry-name">${esc(name)}</div>
    <div class="entry-body">
      <p class="entry-meaning${item.meaning ? "" : " empty"}">${esc(item.meaning) || "（没有含义）"}</p>
      ${keywords}
      <p class="entry-meta">${meta}</p>
    </div>
    <div class="entry-ops">
      <button class="btn${pending ? " on" : ""}" type="button" data-act="approve">${pending ? "审核" : "驳回"}</button>
      <button class="btn" type="button" data-act="edit">修改</button>
      <button class="btn" type="button" data-act="del">删除</button>
    </div>
  </article>`;
}

function renderPager(total, page, size) {
  const box = $("pager");
  const pages = Math.max(1, Math.ceil(total / size));
  if (total <= size) { box.hidden = true; return; }
  box.hidden = false;
  box.innerHTML = `<button class="btn btn-sm" type="button" data-page="${page - 1}" ${page <= 1 ? "disabled" : ""}>上一页</button>
    <span>第 ${page} / ${pages} 页 · 共 ${total} 条</span>
    <button class="btn btn-sm" type="button" data-page="${page + 1}" ${page >= pages ? "disabled" : ""}>下一页</button>`;
}

$("pager").addEventListener("click", (event) => {
  const button = event.target.closest("button[data-page]");
  if (!button || button.disabled) return;
  state.page = Number(button.dataset.page);
  loadList();
});

function syncBulk() {
  const isPending = state.bucket === "pending" && state.items.size > 0;
  $("bulkbar").hidden = !isPending;
  if (!isPending) return;
  const count = state.selected.size;
  $("pickInfo").textContent = `已选 ${count} 条`;
  $("bulkApprove").disabled = count === 0;
  $("bulkDelete").disabled = count === 0;
  const picks = Array.from(document.querySelectorAll("#list .entry-pick input"));
  $("pickAll").checked = picks.length > 0 && picks.every((box) => box.checked);
  $("pickAll").indeterminate = count > 0 && !$("pickAll").checked;
}

async function loadTree() {
  const data = await req("tree");
  state.tree = data;
  state.names = {};
  (data.buckets || []).forEach((bucket) => {
    (bucket.subs || []).forEach((sub) => {
      if (sub.scope && sub.name) state.names[sub.scope] = sub.name;
    });
  });
  renderNav();
}

async function loadList() {
  const params = new URLSearchParams({
    bucket: state.bucket,
    search: state.search,
    scope: state.scoped ? state.scope : "",
    scoped: state.scoped ? "true" : "false",
    page: String(state.page),
    size: String(state.size),
    sort: state.sort,
  });
  const data = await req("list?" + params.toString());
  if (!data.items.length && state.page > 1) {
    state.page -= 1;
    return loadList();
  }
  state.items.clear();
  state.selected.clear();

  const label = LABELS[state.bucket] || state.bucket;
  $("title").firstChild.textContent = titleOf();
  $("subtitle").textContent = `${data.total} 条`;
  $("sort").hidden = state.bucket === "wiki";
  $("addBtn").hidden = state.bucket !== "manual";

  (data.items || []).forEach((item) => state.items.set(item.id, item));
  $("list").innerHTML = (data.items || []).length
    ? data.items.map(entryHTML).join("")
    : `<div class="empty">这里还没有词条</div>`;
  syncBulk();
  renderPager(data.total, data.page || state.page, data.size || state.size);
}

async function refresh() {
  try { await loadTree(); } catch (error) { toast(`侧栏读取失败：${error.message}`, "bad"); }
  try { await loadList(); } catch (error) {
    $("list").innerHTML = `<div class="empty">列表读取失败：${esc(error.message)}</div>`;
  }
}

/* ---------- 词条操作 ---------- */

$("list").addEventListener("change", (event) => {
  const box = event.target.closest(".entry-pick input");
  if (!box) return;
  const row = box.closest(".entry");
  const key = row.dataset.key;
  if (box.checked) state.selected.add(key);
  else state.selected.delete(key);
  row.classList.toggle("picked", box.checked);
  syncBulk();
});

$("list").addEventListener("click", async (event) => {
  const button = event.target.closest("button[data-act]");
  if (!button) return;
  const row = button.closest(".entry");
  const item = state.items.get(row.dataset.key);
  if (!item) return;
  const act = button.dataset.act;

  if (act === "confirm-del") {
    button.disabled = true;
    try {
      const data = await req("delete", { table: item.table, name: item.content, scope: item.scope || "" });
      toast(data.message || "已删除", "ok");
      await refresh();
    } catch (error) {
      toast(error.message, "bad");
      button.disabled = false;
    }
    return;
  }
  if (act === "cancel") {
    closeArmed(row);
    return;
  }
  if (act === "del") {
    armDelete(row);
    return;
  }
  if (act === "approve") {
    button.disabled = true;
    try {
      const data = await req("approve", { table: item.table, name: item.content, scope: item.scope || "" });
      toast(data.message || "已处理", "ok");
      await refresh();
    } catch (error) {
      toast(error.message, "bad");
      button.disabled = false;
    }
    return;
  }
  if (act === "edit") {
    openEditor(item);
  }
});

function armDelete(row) {
  const ops = row.querySelector(".entry-ops");
  if (!ops || ops.dataset.armed) return;
  ops.dataset.armed = "1";
  ops.dataset.backup = ops.innerHTML;
  ops.innerHTML = `<button class="btn armed" type="button" data-act="confirm-del">确认删除</button>
    <button class="btn" type="button" data-act="cancel">取消</button>`;
  ops.style.gridTemplateColumns = "1fr 1fr";
}

function closeArmed(row) {
  const ops = row.querySelector(".entry-ops");
  if (!ops || !ops.dataset.armed) return;
  ops.innerHTML = ops.dataset.backup || "";
  ops.style.gridTemplateColumns = "";
  delete ops.dataset.armed;
  delete ops.dataset.backup;
}

/* ---------- 录入 / 修改 ---------- */

function updateCounter() {
  const text = $("fMeaning").value || "";
  const over = text.length > state.limit;
  $("fCount").textContent = `${text.length}/${state.limit}`;
  $("fCount").classList.toggle("over", over);
  $("editSave").disabled = over || !text.trim() || !$("fName").value.trim();
}

$("fMeaning").addEventListener("input", updateCounter);
$("fName").addEventListener("input", updateCounter);

function openEditor(item) {
  state.editing = item || null;
  const editing = Boolean(item);
  $("editTitle").textContent = editing ? "修改词条" : "手动录入";
  $("editSub").textContent = editing
    ? "改完直接生效；改名或改作用域会做重名检查。"
    : "录入的词条会直接进「手动」，参与注入。";
  const scope = item ? item.scope : (state.scoped ? state.scope : "");
  $("fScope").innerHTML = scopeOptions(scope);
  $("fName").value = item ? item.content : "";
  $("fKeywords").value = item ? (item.keywords || "") : "";
  $("fMeaning").value = item ? (item.meaning || "") : "";
  $("fScope").value = scope || "__global__";
  $("editHint").textContent = "";
  updateCounter();
  openMask($("editMask"));
  setTimeout(() => $("fName").focus(), 60);
}

$("addBtn").addEventListener("click", () => openEditor(null));

$("editSave").addEventListener("click", async () => {
  const name = $("fName").value.trim();
  const meaning = $("fMeaning").value.trim();
  const keywords = $("fKeywords").value.trim();
  const raw = $("fScope").value;
  const scope = raw === "__global__" ? "" : raw;
  if (!name || !meaning) { toast("词条名和内容都要填", "bad"); return; }

  const button = $("editSave");
  button.disabled = true;
  try {
    if (state.editing) {
      const item = state.editing;
      const data = await req("update", {
        table: item.table, old_name: item.content, old_scope: item.scope || "",
        name, meaning, keywords, scope,
      });
      toast(data.message || "已更新", "ok");
      closeMask($("editMask"));
      state.editing = null;
      await refresh();
    } else {
      const dup = await req("lookup", { name, scope });
      const manual = (dup.items || []).find((x) => x.source === "manual");
      if (manual) {
        $("editHint").textContent = `「${name}」在这个作用域已经有了（${manual.table === "manual" ? "手动" : "手动待审"}），要改内容请用「修改」。`;
        toast("已存在同名手动词条", "bad");
        button.disabled = false;
        return;
      }
      const auto = (dup.items || []).find((x) => x.source !== "manual");
      if (auto) {
        showConfirm("要新建吗？",
          `黑话库已有同名条目「${name}」：\n${(auto.meaning || "").slice(0, 60)}…\n\n继续会在「手动」里新建一条，不会覆盖黑话库那条。`,
          "仍要新建", async () => {
            await submitAdd(name, meaning, keywords, scope);
          });
        button.disabled = false;
        return;
      }
      await submitAdd(name, meaning, keywords, scope);
    }
  } catch (error) {
    $("editHint").textContent = error.message;
    toast(error.message, "bad");
    button.disabled = false;
  }
});

async function submitAdd(name, meaning, keywords, scope) {
  try {
    const data = await req("add", { name, content: name, meaning, keywords, scope });
    toast(data.message || "已录入", "ok");
    closeMask($("editMask"));
    state.editing = null;
    await refresh();
  } catch (error) {
    $("editHint").textContent = error.message;
    toast(error.message, "bad");
  } finally {
    updateCounter();
  }
}

/* ---------- 批量 ---------- */

$("pickAll").addEventListener("change", () => {
  const on = $("pickAll").checked;
  state.selected.clear();
  document.querySelectorAll("#list .entry").forEach((row) => {
    const box = row.querySelector(".entry-pick input");
    if (!box) return;
    box.checked = on;
    row.classList.toggle("picked", on);
    if (on) state.selected.add(row.dataset.key);
  });
  syncBulk();
});

async function bulkAction(action) {
  const items = Array.from(state.selected).map((key) => {
    const item = state.items.get(key);
    return item ? { table: item.table, name: item.content, scope: item.scope || "" } : null;
  }).filter(Boolean);
  if (!items.length) return;
  try {
    const data = await req("bulk", { action, items });
    toast(data.message || "完成", "ok");
    await refresh();
  } catch (error) {
    toast(error.message, "bad");
  }
}

$("bulkApprove").addEventListener("click", () => bulkAction("approve"));
$("bulkDelete").addEventListener("click", () => {
  const count = state.selected.size;
  if (!count) return;
  showConfirm("删除所选", `确定删除选中的 ${count} 条待审吗？删了就找不回来了。`, "确认删除",
    () => bulkAction("delete"));
});

/* ---------- 工具栏 ---------- */

let searchTimer;
$("search").addEventListener("input", (event) => {
  clearTimeout(searchTimer);
  const value = event.target.value.trim();
  searchTimer = setTimeout(() => {
    state.search = value;
    state.page = 1;
    loadList().catch((error) => toast(error.message, "bad"));
  }, 260);
});

$("sort").addEventListener("change", (event) => {
  state.sort = event.target.value === "count" ? "count" : "recent";
  state.page = 1;
  loadList().catch((error) => toast(error.message, "bad"));
});

/* ---------- 主题 / 快捷键 ---------- */

$("theme").addEventListener("click", () => {
  const html = document.documentElement;
  const next = html.getAttribute("data-theme") === "dark" ? "light" : "dark";
  html.setAttribute("data-theme", next);
  try { localStorage.setItem("qqbotlite-theme", next); } catch (error) {}
});

function isTyping(node) {
  if (!node) return false;
  const tag = node.tagName;
  return tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || node.isContentEditable;
}

document.addEventListener("keydown", (event) => {
  if (event.key === "/" && !event.ctrlKey && !event.metaKey && !event.altKey) {
    if (isTyping(event.target) || document.querySelector(".overlay:not([hidden])")) return;
    event.preventDefault();
    $("search").focus();
  }
  if (event.key === "Escape") {
    document.querySelectorAll(".overlay:not([hidden])").forEach(closeMask);
  }
});

/* ---------- 启动 ---------- */

async function boot() {
  const params = new URLSearchParams(location.search);
  const wantBucket = params.get("bucket");
  if (wantBucket) state.bucket = wantBucket;
  if (params.has("scope")) {
    const raw = params.get("scope") || "";
    state.scope = raw === "__global__" ? "" : raw;
    state.scoped = true;
  }
  let info = {};
  try {
    info = await req("ping");
    state.limit = info.limit || 200;
  } catch (error) {
    $("diag").textContent = `自检失败：${error.message}`;
    toast(error.message, "bad");
  }
  if (info.ok) {
    $("diag").textContent =
      `自检 ok · ${info.rows} 条 · 梗库 ${info.wiki}\n` +
      `${info.enabled ? (info.auto_learn ? "自动学习中" : "自动学习关闭") : "已停止"}` +
      ` · 缓冲 ${info.buffer || 0}`;
  }
  try { await loadTree(); } catch (error) { $("diag").textContent = `自检失败：${error.message}`; }
  updateCounter();
  try { await loadList(); } catch (error) {
    $("list").innerHTML = `<div class="empty">列表读取失败：${esc(error.message)}</div>`;
  }
  if (params.get("new") === "1") openEditor(null);
}

boot();
</script>
</body>
